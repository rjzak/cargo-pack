[package]
name = "cargo-pack"
description = "A cargo subcommand that builds and packs your binary into a self-extracting, compressed executable."
categories = ["development-tools", "development-tools::cargo-plugins"]
edition = "2024"
keywords = [
    "cargo",
    "subcommand",
    "packing",
    "cargo-subcommand",
    "compression",
]
license = "MIT"
readme = "README.md"
repository = "https://github.com/rjzak/cargo-pack"
version = "0.0.0"

[features]
default = ["macos-auditable"]
# Reserve a 64 KiB slot in the cargo-pack binary so that packed *Mach-O* binaries
# can carry a cargo-auditable SBOM readable by `cargo audit bin` (see
# src/auditable.rs). This costs ~64 KiB of file size in every packed macOS binary
# even when cargo-auditable isn't used. Disable with `--no-default-features` for
# zero overhead; the SBOM then stays recoverable via `cargo pack unpack`. No
# effect on ELF/PE targets, which add the section on demand.
macos-auditable = []

[dependencies]
anyhow = "1.0"
bytecount = { version = "0.6.9", features = ["runtime-dispatch-simd"] }
bzip2 = "0.6"
clap = { version = "4.6", features = ["derive"] }
crc32fast = "1.5"
flate2 = "1.1"
lz4_flex = "0.14"
object = { version = "0.40.0", default-features = false, features = ["read", "std"] }
serde_json = "1.0"
xz2 = { version = "0.1", features = ["static"] }
zstd = "0.13"

[profile.release]
codegen-units = 1
lto = true
strip = true
