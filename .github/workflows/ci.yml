name: Test
on: [push, pull_request]
permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
          - runner: ubuntu-24.04-arm
          - runner: macos-15
          - runner: windows-latest
            ext: .exe
          - runner: windows-11-arm
            ext: .exe
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 #v1
      - name: Update Rust
        run: rustup update
      - name: Install cargo audit & auditable
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-audit,cargo-auditable
      - name: cargo test
        run: |
          cargo test --all-features
          cargo test --release
      - name: Test with hello world
        run: |
          cargo install --path .
          cd hello_world
          cargo auditable pack build
          cargo pack info ./target/debug/hello-world${{ matrix.platform.ext }}
          cargo audit bin ./target/debug/hello-world${{ matrix.platform.ext }}
          ./target/debug/hello-world${{ matrix.platform.ext }}
          cargo pack unpack ./target/debug/hello-world${{ matrix.platform.ext }}
          ./hello-world${{ matrix.platform.ext }}
          cargo audit bin ./hello-world${{ matrix.platform.ext }}

  fmt_clippy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            crates.io:443
            index.crates.io:443
            github.com:443
            githubapp.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            static.crates.io:443
            static.rust-lang.org:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rui314/setup-mold@10ca16bf91dc22e05ebdc935cad9c75ea248f621 #v1
      - name: cargo fmt
        run: cargo fmt -- --check
      - name: cargo clippy
        run: cargo clippy --all-features --tests -- -D warnings

  check-spdx-headers:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            github.com:443
            githubapp.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: enarx/spdx@b5bfdd4410071bf058c8333d0e70020001524b6b # master
        with:
          licenses: MIT
