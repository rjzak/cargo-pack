name: Release
on: [push]
permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 15
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            os: linux
            musl: x86_64-unknown-linux-musl
            name: cargo-pack-x86_64-linux-musl
          - runner: ubuntu-24.04-arm
            os: linux
            musl: aarch64-unknown-linux-musl
            name: cargo-pack-aarch64-linux-musl
          - runner: macos-15
            os: macos
            name: cargo-pack-arm64-darwin
          - runner: windows-latest
            name: cargo-pack-x86_64-windows-msvc.exe
            ext: .exe
          - runner: windows-11-arm
            name: cargo-pack-arm64-windows-msvc.exe
            ext: .exe
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rui314/setup-mold@7e4f20ad28a2e8ca6fd0892ccf72e2abb706b9c3 #v1
      - name: Update Rust
        run: rustup update
      - name: Install cargo auditable
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-auditable
      - name: Install musl
        if: matrix.platform.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl musl-dev musl-tools
          rustup target install ${{ matrix.platform.musl }}
      - name: Build release musl
        if: matrix.platform.os == 'linux'
        run: |
          cargo auditable build --release --target=${{ matrix.platform.musl }}
          mv target/${{ matrix.platform.musl }}/release/cargo-pack ${{ matrix.platform.name}}
      - name: Build release
        if: matrix.platform.os != 'linux'
        run: |
          cargo auditable build --release
          mv target/release/cargo-pack${{ matrix.platform.ext }} ${{ matrix.platform.name }}
      - name: Upload binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform.name }}
          path: ${{ matrix.platform.name }}
          retention-days: 5

  release:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    name: GitHub Release
    needs: [ build ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
    - name: Harden Runner
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit
        allowed-endpoints: >
          api.github.com:443
          api.snapcraft.io:443
          azure.archive.ubuntu.com:80
          cdn.fwupd.org:443
          esm.ubuntu.com:443
          github.com:443
          motd.ubuntu.com:443
          objects.githubusercontent.com:443
          release-assets.githubusercontent.com:443
          uploads.github.com:443
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - id: version
      run: echo "version=$(cargo metadata --format-version=1 --no-deps | jq '.packages[] | select(.name == "cargo-packer") | .version' --raw-output)" >>$GITHUB_OUTPUT
    - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        merge-multiple: true
    - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        draft: true
        generate_release_notes: true
        fail_on_unmatched_files: true
        files: |
          cargo-pack*
    - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: |
          cargo-pack*

  crates_io_publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    name: Publish to crates.io
    needs: [ release ]
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          allowed-endpoints: >
            azure.archive.ubuntu.com:80
            cdn.fwupd.org:443
            crates.io:443
            esm.ubuntu.com:443
            github.com:443
            index.crates.io:443
            motd.ubuntu.com:443
            ppa.launchpadcontent.net:443
            static.crates.io:443
            static.rust-lang.org:443

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}